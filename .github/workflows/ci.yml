name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check out the app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: amedina068/snapsbrew
          path: .app

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: gd, intl, exif, bcmath
          tools: composer:v2

      - name: Install the PHP packages of the app
        working-directory: .app
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check the docs against the app
        env:
          SNAPSBREW_APP_PATH: ${{ github.workspace }}/.app
        run: node scripts/check-docs.mjs
