name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the docs
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: amedina068/snapsbrew
          path: .app

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, intl, exif, bcmath
          tools: composer:v2

      - name: Install the PHP packages of the app
        working-directory: .app
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check the docs against the app
        env:
          SNAPSBREW_APP_PATH: ${{ github.workspace }}/.app
        run: node scripts/check-docs.mjs
